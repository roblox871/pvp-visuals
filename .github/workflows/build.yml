name: Build Minecraft Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Выдача прав на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка проекта с помощью Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: Сохранение готового JAR-файла
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
